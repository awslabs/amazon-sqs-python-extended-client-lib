name: Publish

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: |
          pip install poetry
          poetry --version
      - name: Build package
        run: |
          poetry build
      - name: Publish artifact
        uses: smarterdx/actions/actions/publish-python@publish-python/v0
        with:
          buildCommand: ""
